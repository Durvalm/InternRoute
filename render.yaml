services:
  - type: web
    name: internroute-api
    runtime: python
    plan: starter
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    preDeployCommand: flask db upgrade
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: APP_ENV
        value: production
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_COOKIE_DOMAIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: internroute-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPERUSER_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_RELEASE
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: ANALYTICS_APP_VERSION
        sync: false
      - key: LEETCODE_API_BASE_URL
        value: https://alfa-leetcode-api.onrender.com
      - key: LEETCODE_API_TIMEOUT_SECONDS
        value: "20"
      - key: JUDGE0_BASE_URL
        value: https://ce.judge0.com
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_RAPIDAPI_HOST
        sync: false
      - key: JUDGE0_AUTH_TOKEN
        sync: false

databases:
  - name: internroute-db
    plan: starter
    databaseName: internroute
    user: internroute
